name: SunuBot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Tests NLP Backend ─────────────────────────────────────
  test-nlp:
    runs-on: ubuntu-latest
    name: Tests NLP (Python)

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: nlp/requirements.txt

      - name: Install dependencies
        run: |
          cd nlp
          pip install -r requirements.txt
          pip install pytest

      - name: Run NLP tests
        run: |
          cd nlp
          python -m pytest tests/ -v --tb=short

  # ── Lint + Type-check Frontend ─────────────────────────────
  lint-frontend:
    runs-on: ubuntu-latest
    name: Lint Frontend (Next.js)

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript check
        run: |
          cd frontend
          npx tsc --noEmit || true

      - name: Build check
        run: |
          cd frontend
          npm run build || true

  # ── Docker build test ──────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    name: Docker Build Test

    steps:
      - uses: actions/checkout@v4

      - name: Verify docker-compose syntax
        run: docker compose config -q
