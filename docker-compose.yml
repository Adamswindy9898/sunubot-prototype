version: "3.9"

# ── SunuBot — Docker Compose ─────────────────────────────────────
# Chatbot Administratif Multilingue Francais/Wolof
# Memoire M2 IA — Universite de Thies
# Auteur : Adama Gaye
#
# Usage : docker-compose up -d
# Arret : docker-compose down

services:

  # ── PostgreSQL 14 ───────────────────────────────────────────
  postgres:
    image: postgres:14-alpine
    container_name: sunubot-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Adams}
      POSTGRES_DB: sunubot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - sunubot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sunubot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Frontend Next.js ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sunubot-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-Adams}@postgres:5432/sunubot
      - JWT_SECRET=${JWT_SECRET:-sunubot-secret-m2-ia-2024-thies}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin2024}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - MISTRAL_MODEL=${MISTRAL_MODEL:-mistral-small-latest}
    depends_on:
      postgres:
        condition: service_healthy
      nlp:
        condition: service_healthy
    networks:
      - sunubot-network
    restart: unless-stopped

  # ── Backend NLP Python ───────────────────────────────────────
  nlp:
    build:
      context: ./nlp
      dockerfile: Dockerfile
    container_name: sunubot-nlp
    ports:
      - "8000:8000"
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - MISTRAL_MODEL=${MISTRAL_MODEL:-mistral-small-latest}
    volumes:
      - nlp-models:/app/models
    networks:
      - sunubot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── MCP Server Etat Civil ────────────────────────────────────
  mcp-etat-civil:
    build:
      context: ./mcp-servers/etat-civil
      dockerfile: Dockerfile
    container_name: sunubot-mcp-etat-civil
    networks:
      - sunubot-network
    restart: unless-stopped

  # ── MCP Server DGID ──────────────────────────────────────────
  mcp-dgid:
    build:
      context: ./mcp-servers/dgid
      dockerfile: Dockerfile
    container_name: sunubot-mcp-dgid
    networks:
      - sunubot-network
    restart: unless-stopped

  # ── MCP Server Wolof NLP ─────────────────────────────────────
  mcp-wolof-nlp:
    build:
      context: ./mcp-servers/wolof-nlp
      dockerfile: Dockerfile
    container_name: sunubot-mcp-wolof-nlp
    networks:
      - sunubot-network
    restart: unless-stopped

  # ── MCP Server Formulaires ───────────────────────────────────
  mcp-formulaires:
    build:
      context: ./mcp-servers/formulaires
      dockerfile: Dockerfile
    container_name: sunubot-mcp-formulaires
    networks:
      - sunubot-network
    restart: unless-stopped

# ── Volumes ──────────────────────────────────────────────────────
volumes:
  pgdata:
    driver: local
  nlp-models:
    driver: local

# ── Networks ─────────────────────────────────────────────────────
networks:
  sunubot-network:
    driver: bridge
